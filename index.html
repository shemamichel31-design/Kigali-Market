function setL(l){lang=l;document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l==l));document.querySelectorAll('[data-t]').forEach(e=>{if(T[l][e.dataset.t])e.innerText=T[l][e.dataset.t]});filter()}

function sw(m){mode=m;document.getElementById('t1').className=m=='login'?'on':'';document.getElementById('t2').className=m=='signup'?'on':'';document.getElementById('nm').style.display=m=='signup'?'block':'none';document.getElementById('ab').innerText=m=='signup'?'Sign Up':'Login'}

function showU(){let u=JSON.parse(localStorage.getItem('su')||'null');if(u){document.getElementById('lb').innerText=u.name.split(' ')[0];document.getElementById('un').innerText=u.name;document.getElementById('ub').style.display='flex'}}
function logout(){localStorage.removeItem('su');location.reload()}

function filter(){let q=document.getElementById('q').value.toLowerCase();let L=P.filter(p=>(cur=="All"||p[1]==cur)&&p[0].toLowerCase().includes(q));document.getElementById('grid').innerHTML=L.map(p=>`<div class="card"><img src="https://images.unsplash.com/${p[3]}?w=400" onerror="this.src='https://via.placeholder.com/400?text=SHEMA'"><div class="in"><b>${p[0]}</b><div style="font-size:12px;color:#888">${p[1]} • Kigali</div><div class="price">${p[2].toLocaleString()} RWF</div><button class="btn2" onclick="add(${P.indexOf(p)})">➕ ${T[lang].add}</button><a class="btn" href="https://wa.me/${WA}?text=${encodeURIComponent('Hello SHEMA MARKET! I want: '+p[0])}">${T[lang].ord}</a></div></div>`).join('')||'<p style="grid-column:1/3;text-align:center;padding:20px">'+T[lang].no+'</p>'}

function upd(){document.getElementById('c').innerText=cart.length;document.getElementById('t').innerText=cart.reduce((s,p)=>s+p[2],0).toLocaleString()+' RWF'}
