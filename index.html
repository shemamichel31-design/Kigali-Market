<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SHEMA MARKET - Kigali</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f0f2f5;color:#111;padding-bottom:90px;font-family:Arial,sans-serif}
header{background:#1e6bff;color:white;padding:14px;position:sticky;top:0;z-index:10}
.top{display:flex;justify-content:space-between;align-items:center}
.top h1{font-size:22px}
.top button{background:white;color:#1e6bff;border:none;padding:8px 12px;border-radius:20px;font-weight:bold}
.livebar{background:#ff0000;color:white;padding:10px;text-align:center;font-weight:bold;font-size:14px;cursor:pointer}
.search{padding:12px 15px;background:white}
.search input{width:100%;padding:13px;border:1px solid #ddd;border-radius:25px;font-size:16px}
.cats{display:flex;gap:8px;overflow-x:auto;padding:12px 15px}
.cats button{white-space:nowrap;border:1px solid #ddd;background:white;padding:8px 16px;border-radius:20px}
.cats button.active{background:#1e6bff;color:white;border-color:#1e6bff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 15px}
.card{background:white;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.card img{width:100%;height:140px;object-fit:cover;background:#eee}
.card .in{padding:10px}
.price{color:#1e6bff;font-weight:bold;margin:5px 0}
.btn{display:block;background:#25D366;color:white;text-align:center;padding:10px;text-decoration:none;border-radius:8px;font-weight:bold;margin-top:8px;border:none;width:100%;font-size:14px}
.btn2{display:block;background:#1e6bff;color:white;text-align:center;padding:9px;text-decoration:none;border-radius:8px;font-weight:bold;margin-top:6px;border:none;width:100%;font-size:14px}
footer{text-align:center;padding:20px;color:#666;font-size:13px}
.cartbar{position:fixed;bottom:0;left:0;right:0;background:#111;color:white;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;z-index:20}
.cartbar button{background:#25D366;color:white;border:none;padding:10px 18px;border-radius:20px;font-weight:bold}
</style>
</head>
<body>
<header><div class="top"><h1>🛒 SHEMA MARKET</h1><button onclick="location.href='https://wa.me/250734311682'">📍 Kigali</button></div><p style="font-size:13px;margin-top:4px">Fresh • Fast • Affordable - Kigali Market Online</p></header>
<div class="livebar" onclick="location.href='https://wa.me/250734311682?text='+encodeURIComponent('Hello SHEMA MARKET! Ndi live, ndashaka kugura!')">🔴 LIVE NOW - <span id="viewers">128</span> bari kureba • Kanda hano ugure LIVE!</div>
<div class="search"><input id="q" placeholder="🔍 Shaka... e.g. Avocado, Rice, Shoes" oninput="filter()"></div>
<div class="cats" id="cats"></div>
<div class="grid" id="grid"></div>
<footer>📞 WhatsApp: 0734311682<br>© 2026 SHEMA MARKET - Kigali, Rwanda</footer>
<div class="cartbar"><span>🛒 Cart: <b id="count">0</b> ibintu • <b id="total">0 RWF</b></span><button onclick="checkout()">Checkout WhatsApp →</button></div>
<script>
const WA="250734311682";
const products=[
{name:"Avocado Fresh (5 pcs)",cat:"Food",price:3000,img:"https://images.unsplash.com/photo-1523049673857-eb18f1d7b578?w=400"},
{name:"Irish Potatoes 5kg",cat:"Food",price:5000,img:"https://images.unsplash.com/photo-1518977676601-b53f82aba655?w=400"},
{name:"Rice 5kg - Long Grain",cat:"Food",price:7500,img:"https://images.unsplash.com/photo-1586201375761-83865001e31c?w=400"},
{name:"Fresh Tomatoes 2kg",cat:"Food",price:2500,img:"https://images.unsplash.com/photo-1546094096-0df4bcaaa337?w=400"},
{name:"Bananas (Ibitoki) 1 bunch",cat:"Food",price:4000,img:"https://images.unsplash.com/photo-1571771894821-ce9b6c11b08e?w=400"},
{name:"Kitenge Fabric",cat:"Fashion",price:15000,img:"https://images.unsplash.com/photo-1528459801416-a9e53bbf4e17?w=400"},
{name:"Sneakers - White",cat:"Fashion",price:35000,img:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400"},
{name:"Handbag - Leather",cat:"Fashion",price:25000,img:"https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=400"},
{name:"Phone Charger Fast",cat:"Electronics",price:12000,img:"https://images.unsplash.com/photo-1583863788434-e58a36330cf0?w=400"},
{name:"Bluetooth Earbuds",cat:"Electronics",price:28000,img:"https://images.unsplash.com/photo-1590658268037-6bf12165a8df?w=400"},
{name:"Woven Basket - Agaseke",cat:"Home",price:18000,img:"https://images.unsplash.com/photo-1610701596007-11502861dcfa?w=400"},
{name:"Cooking Pot Set",cat:"Home",price:45000,img:"https://images.unsplash.com/photo-1584990347449-a2d4c2c2e1a5?w=400"}
];
let cur="All",cart=[];
const cats=["All","Food","Fashion","Electronics","Home"];
function renderCats(){document.getElementById('cats').innerHTML=cats.map(c=>`<button class="${c==cur?'active':''}" onclick="setCat('${c}')">${c}</button>`).join('');}
function setCat(c){cur=c;renderCats();filter();}
function filter(){
let q=document.getElementById('q').value.toLowerCase();
let list=products.filter(p=>(cur=="All"||p.cat==cur)&&p.name.toLowerCase().includes(q));
document.getElementById('grid').innerHTML=list.map((p,i)=>`
<div class="card"><img src="${p.img}" onerror="this.src='https://via.placeholder.com/400x300?text=SHEMA+MARKET'"><div class="in"><b>${p.name}</b><div style="font-size:12px;color:#888">${p.cat} • Kigali</div><div class="price">${p.price.toLocaleString()} RWF</div><button class="btn2" onclick="add(${products.indexOf(p)})">➕ Add to Cart</button><a class="btn" href="https://wa.me/${WA}?text=${encodeURIComponent('Hello SHEMA MARKET! Ndashaka kugura: '+p.name+' - '+p.price+' RWF')}">Order on WhatsApp</a></div></div>`).join('')||'<p style="grid-column:1/3;text-align:center;padding:20px">Nta byabonetse 😔</p>';
}
function add(i){cart.push(products[i]);updateCart();alert(products[i].name+' yongewe muri Cart!');}
function updateCart(){let t=cart.reduce((s,p)=>s+p.price,0);document.getElementById('count').innerText=cart.length;document.getElementById('total').innerText=t.toLocaleString()+' RWF';}
function checkout(){if(!cart.length)return alert('Cart irimo ubusa, hitamo ibicuruzwa!');let msg='Hello SHEMA MARKET! Ndashaka kugura LIVE:\n\n'+cart.map(p=>'- '+p.name+' : '+p.price+' RWF').join('\n')+'\n\nTOTAL: '+cart.reduce((s,p)=>s+p.price,0).toLocaleString()+' RWF';location.href='https://wa.me/'+WA+'?text='+encodeURIComponent(msg);}
setInterval(()=>{document.getElementById('viewers').innerText=120+Math.floor(Math.random()*60);},3000);
renderCats();filter();
</script>
</body>
</html>
