<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SHEMA MARKET - Kigali</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f0f2f5;color:#111;padding-bottom:90px;font-family:Arial,sans-serif}
header{background:#1e6bff;color:white;padding:14px;position:sticky;top:0;z-index:10}
.top{display:flex;justify-content:space-between;align-items:center}
.top h1{font-size:20px}
.top button{background:white;color:#1e6bff;border:none;padding:8px 12px;border-radius:20px;font-weight:bold}
.livebar{background:#ff0000;color:white;padding:10px;text-align:center;font-weight:bold;font-size:14px;cursor:pointer}
.search{padding:12px 15px;background:white}
.search input{width:100%;padding:13px;border:1px solid #ddd;border-radius:25px;font-size:16px}
.cats{display:flex;gap:8px;overflow-x:auto;padding:12px 15px}
.cats button{white-space:nowrap;border:1px solid #ddd;background:white;padding:8px 16px;border-radius:20px}
.cats button.active{background:#1e6bff;color:white;border-color:#1e6bff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 15px}
.card{background:white;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.card img{width:100%;height:140px;object-fit:cover;background:#eee}
.card .in{padding:10px}
.price{color:#1e6bff;font-weight:bold;margin:5px 0}
.btn{display:block;background:#25D366;color:white;text-align:center;padding:10px;border-radius:8px;font-weight:bold;margin-top:8px;border:none;width:100%;font-size:14px;text-decoration:none}
.btn2{display:block;background:#1e6bff;color:white;text-align:center;padding:9px;border-radius:8px;font-weight:bold;margin-top:6px;border:none;width:100%;font-size:14px}
footer{text-align:center;padding:20px;color:#666;font-size:13px}
.cartbar{position:fixed;bottom:0;left:0;right:0;background:#111;color:white;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;z-index:20}
.cartbar button{background:#25D366;color:white;border:none;padding:10px 18px;border-radius:20px;font-weight:bold}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:99;align-items:center;justify-content:center;padding:20px}
.modal.open{display:flex}
.box{background:white;width:100%;max-width:380px;border-radius:16px;padding:22px;position:relative}
.box h2{text-align:center}
.box p{text-align:center;color:#666;font-size:13px;margin:6px 0 14px}
.box input{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin-bottom:10px;font-size:15px}
.box .g{background:white;border:1px solid #ddd;padding:12px;border-radius:10px;width:100%;font-weight:bold;margin-bottom:10px;font-size:15px}
.box .main{background:#1e6bff;color:white;border:none;padding:13px;border-radius:10px;width:100%;font-weight:bold;font-size:16px}
.box .phone{background:#25D366;color:white;border:none;padding:13px;border-radius:10px;width:100%;font-weight:bold;font-size:15px;margin-top:8px}
.close{position:absolute;right:14px;top:10px;font-size:22px;border:none;background:none}
.tabs{display:flex;background:#f0f2f5;border-radius:10px;padding:4px;margin-bottom:14px}
.tabs button{flex:1;padding:9px;border:none;border-radius:8px;background:transparent;font-weight:bold}
.tabs button.active{background:white}
.userbar{background:#e8f0ff;padding:8px 15px;display:flex;justify-content:space-between;align-items:center;font-size:14px}
.userbar button{background:#ff4444;color:white;border:none;padding:5px 10px;border-radius:12px}
</style>
</head>
<body>
<header><div class="top"><h1>🛒 SHEMA MARKET</h1><button onclick="openLogin()">👤 <span id="loginBtn">Login</span></button></div><p style="font-size:13px;margin-top:4px">Fresh • Fast • Affordable - Kigali Market Online</p></header>
<div id="userbar" class="userbar" style="display:none">Muraho, <b id="userName"></b> 👋 <button onclick="logout()">Logout</button></div>
<div class="livebar" onclick="location.href='https://wa.me/250734311682?text='+encodeURIComponent('Hello SHEMA MARKET! Ndi live!')">🔴 LIVE NOW - <span id="viewers">128</span> bari kureba • Kanda hano ugure LIVE!</div>
<div class="search"><input id="q" placeholder="🔍 Shaka..." oninput="filter()"></div>
<div class="cats" id="cats"></div>
<div class="grid" id="grid"></div>
<footer>📞 WhatsApp: 0734311682<br>© 2026 SHEMA MARKET - Kigali</footer>
<div class="cartbar"><span>🛒 Cart: <b id="count">0</b> • <b id="total">0 RWF</b></span><button onclick="checkout()">Checkout WhatsApp →</button></div>
<div id="loginModal" class="modal"><div class="box">
<button class="close" onclick="closeLogin()">✕</button>
<h2>Welcome to SHEMA MARKET</h2><p>Winjire cyangwa wiyandikishe</p>
<div class="tabs"><button id="tabLogin" class="active" onclick="switchTab('login')">Login</button><button id="tabSignup" onclick="switchTab('signup')">Sign Up</button></div>
<button class="g" onclick="loginGoogle()">🔍 Continue with Google</button>
<p>— cyangwa —</p>
<input id="nameInput" placeholder="Izina ryawe (Sign Up gusa)" style="display:none">
<input id="emailInput" placeholder="Email - ex: shema@gmail.com" type="email">
<input id="passInput" placeholder="Password" type="password">
<button class="main" onclick="doAuth()" id="authBtn">Login</button>
<button class="phone" onclick="loginPhone()">📱 Login na Phone / WhatsApp</button>
</div></div>
<script>
const WA="250734311682";let mode='login';
function openLogin(){document.getElementById('loginModal').classList.add('open');}
function closeLogin(){document.getElementById('loginModal').classList.remove('open');}
function switchTab(m){mode=m;document.getElementById('tabLogin').className=m=='login'?'active':'';document.getElementById('tabSignup').className=m=='signup'?'active':'';document.getElementById('nameInput').style.display=m=='signup'?'block':'none';document.getElementById('authBtn').innerText=m=='signup'?'Sign Up':'Login';}
function saveUser(n,e){localStorage.setItem('shema_user',JSON.stringify({name:n,email:e}));showUser();closeLogin();}
function showUser(){let u=JSON.parse(localStorage.getItem('shema_user')||'null');if(u){document.getElementById('loginBtn').innerText=u.name.split(' ')[0];document.getElementById('userName').innerText=u.name;document.getElementById('userbar').style.display='flex';}}
function logout(){localStorage.removeItem('shema_user');location.reload();}
function doAuth(){let email=document.getElementById('emailInput').value.trim();let pass=document.getElementById('passInput').value;let name=document.getElementById('nameInput').value.trim()||email.split('@')[0];if(!email||!pass)return alert('Uzuza Email na Password!');if(mode=='signup'){let users=JSON.parse(localStorage.getItem('shema_users')||'{}');if(users[email])return alert('Uyi email yamaze kwiyandikisha!');users[email]={name,pass};localStorage.setItem('shema_users',JSON.stringify(users));saveUser(name,email);alert('Murakaza neza '+name+'! 🎉');}else{let users=JSON.parse(localStorage.getItem('shema_users')||'{}');if(users[email]&&users[email].pass==pass){saveUser(users[email].name,email);alert('Muraho '+users[email].name+'! ✅');}else if(!users[email]){alert('Nta account. Kanda Sign Up.');switchTab('signup');}else alert('Password ntabwo ari yo.');}}
function loginGoogle(){let n=prompt('Izina ryawe rya Google:');if(!n)return;let e=prompt('Gmail yawe:');if(!e)return;saveUser(n,e);alert('Winjiye na Google nka '+n+' ✅');}
function loginPhone(){let p=prompt('Numero ya telefone (ex: 0734311682):');if(!p)return;let n=prompt('Izina ryawe:')||('User '+p.slice(-4));saveUser(n,p);alert('Winjiye na Phone '+p+' ✅');}
const products=[
{name:"Avocado Fresh (5 pcs)",cat:"Food",price:3000,img:"https://images.unsplash.com/photo-1523049673857-eb18f1d7b578?w=400"},
{name:"Irish Potatoes 5kg",cat:"Food",price:5000,img:"https://images.unsplash.com/photo-1518977676601-b53f82aba655?w=400"},
{name:"Rice 5kg - Long Grain",cat:"Food",price:7500,img:"https://images.unsplash.com/photo-1586201375761-83865001e31c?w=400"},
{name:"Fresh Tomatoes 2kg",cat:"Food",price:2500,img:"https://images.unsplash.com/photo-1546094096-0df4bcaaa337?w=400"},
{name:"Bananas (Ibitoki) 1 bunch",cat:"Food",price:4000,img:"https://images.unsplash.com/photo-1571771894821-ce9b6c11b08e?w=400"},
{name:"Kitenge Fabric",cat:"Fashion",price:15000,img:"https://images.unsplash.com/photo-1528459801416-a9e53bbf4e17?w=400"},
{name:"Sneakers - White",cat:"Fashion",price:35000,img:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400"},
{name:"Handbag - Leather",cat:"Fashion",price:25000,img:"https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=400"},
{name:"Phone Charger Fast",cat:"Electronics",price:12000,img:"https://images.unsplash.com/photo-1583863788434-e58a36330cf0?w=400"},
{name:"Bluetooth Earbuds",cat:"Electronics",price:28000,img:"https://images.unsplash.com/photo-1590658268037-6bf12165a8df?w=400"},
{name:"Woven Basket - Agaseke",cat:"Home",price:18000,img:"https://images.unsplash.com/photo-1610701596007-11502861dcfa?w=400"},
{name:"Cooking Pot Set",cat:"Home",price:45000,img:"https://images.unsplash.com/photo-1584990347449-a2d4c2c2e1a5?w=400"}
];
let cur="All",cart=[];const cats=["All","Food","Fashion","Electronics","Home"];
function renderCats(){document.getElementById('cats').innerHTML=cats.map(c=>`<button class="${c==cur?'active':''}" onclick="setCat('${c}')">${c}</button>`).join('');}
function setCat(c){cur=c;renderCats();filter();}
function filter(){let q=document.getElementById('q').value.toLowerCase();let list=products.filter(p=>(cur=="All"||p.cat==cur)&&p.name.toLowerCase().includes(q));document.getElementById('grid').innerHTML=list.map(p=>`<div class="card"><img src="${p.img}" onerror="this.src='https://via.placeholder.com/400x300?text=SHEMA+MARKET'"><div class="in"><b>${p.name}</b><div style="font-size:12px;color:#888">${p.cat} • Kigali</div><div class="price">${p.price.toLocaleString()} RWF</div><button class="btn2" onclick="add(${products.indexOf(p)})">➕ Add to Cart</button><a class="btn" href="https://wa.me/${WA}?text=${encodeURIComponent('Hello SHEMA MARKET! Ndashaka kugura: '+p.name)}">Order on WhatsApp</a></div></div>`).join('')||'<p style="grid-column:1/3;text-align:center;padding:20px">Nta byabonetse 😔</p>';}
function add(i){let u=JSON.parse(localStorage.getItem('shema_user')||'null');if(!u){openLogin();alert('Banza winjire!');return;}cart.push(products[i]);updateCart();alert(products[i].name+' yongewe!');}
function updateCart(){let t=cart.reduce((s,p)=>s+p.price,0);document.getElementById('count').innerText=cart.length;document.getElementById('total').innerText=t.toLocaleString()+' RWF';}
function checkout(){if(!cart.length)return alert('Cart irimo ubusa!');let u=JSON.parse(localStorage.getItem('shema_user')||'null');if(!u){openLogin();return alert('Banza winjire!');}let msg='Hello SHEMA MARKET! Ndi '+u.name+' ('+u.email+')\nNdashaka kugura:\n\n'+cart.map(p=>'- '+p.name+' : '+p.price+' RWF').join('\n')+'\n\nTOTAL: '+cart.reduce((s,p)=>s+p.price,0).toLocaleString()+' RWF';location.href='https://wa.me/'+WA+'?text='+encodeURIComponent(msg);}
setInterval(()=>{document.getElementById('viewers').innerText=120+Math.floor(Math.random()*60);},3000);
showUser();renderCats();filter();
</script>
</body>
</html>
