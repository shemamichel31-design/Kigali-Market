<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHEMA MARKET</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#f0f2f5;font-family:Arial;padding-bottom:80px}header{background:#1e6bff;color:#fff;padding:14px}.top{display:flex;justify-content:space-between}.top button{background:#fff;color:#1e6bff;border:none;padding:8px 12px;border-radius:20px;font-weight:bold}.lang{display:flex;gap:5px;justify-content:center;padding:8px;background:#fff}.lang button{padding:6px 10px;border:1px solid #ddd;border-radius:15px}.lang button.on{background:#1e6bff;color:#fff}.live{background:red;color:#fff;padding:10px;text-align:center;font-weight:bold}.sr{padding:12px;background:#fff}.sr input{width:100%;padding:12px;border:1px solid #ddd;border-radius:25px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}.card{background:#fff;border-radius:12px;overflow:hidden}.card img{width:100%;height:130px;object-fit:cover}.in{padding:10px}.pr{color:#1e6bff;font-weight:bold}.btn{display:block;background:#25D366;color:#fff;text-align:center;padding:9px;border-radius:8px;margin-top:6px;border:none;width:100%}.btn2{display:block;background:#1e6bff;color:#fff;text-align:center;padding:9px;border-radius:8px;margin-top:5px;border:none;width:100%}.cart{position:fixed;bottom:0;left:0;right:0;background:#111;color:#fff;padding:12px;display:flex;justify-content:space-between}.cart button{background:#25D366;color:#fff;border:none;padding:9px 15px;border-radius:20px}.mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:99;align-items:center;justify-content:center;padding:20px}.mo.open{display:flex}.bx{background:#fff;width:100%;max-width:360px;border-radius:14px;padding:20px}.bx input{width:100%;padding:11px;border:1px solid #ddd;border-radius:10px;margin-bottom:9px}.bx .mn{background:#1e6bff;color:#fff;border:none;padding:12px;border-radius:10px;width:100%;font-weight:bold}</style></head><body>
<header><div class="top"><h1>SHEMA MARKET</h1><button onclick="oL()">Login</button></div><p data-t="sub">Fresh - Fast - Affordable</p></header>
<div class="lang"><button data-l="en" class="on" onclick="setL('en')">English</button><button data-l="rw" onclick="setL('rw')">Kinyarwanda</button><button data-l="fr" onclick="setL('fr')">Francais</button><button data-l="sw" onclick="setL('sw')">Kiswahili</button></div>
<div class="live">LIVE NOW - <span id="v">128</span> <span data-t="w">watching</span></div>
<div class="sr"><input id="q" placeholder="Search..." oninput="fil()"></div>
<div class="grid" id="g"></div>
<div class="cart"><span>Cart: <b id="c">0</b> - <b id="t">0 RWF</b></span><button onclick="co()">Checkout</button></div>
<div id="m" class="mo"><div class="bx"><button style="float:right;border:none;background:none;font-size:20px" onclick="cL()">X</button><h2 data-t="wel">Welcome to SHEMA MARKET</h2><p data-t="ls">Login or Sign Up</p><input id="nm" placeholder="Your Name"><input id="em" placeholder="Email"><input id="pw" placeholder="Password" type="password"><button class="mn" onclick="au()">Login / Sign Up</button></div></div>
<script>
let lang='en',cart=[];const T={en:{sub:"Fresh - Fast - Affordable",w:"watching",wel:"Welcome to SHEMA MARKET",ls:"Login or Sign Up",add:"Add to Cart",ord:"Order on WhatsApp"},rw:{sub:"Fresh - Byihuse - Bihendutse",w:"bari kureba",wel:"Murakaza neza kuri SHEMA MARKET",ls:"Injira cyangwa wiyandikishe",add:"Ongera mu Gare",ord:"Tumiza kuri WhatsApp"},fr:{sub:"Frais - Rapide - Abordable",w:"regardent",wel:"Bienvenue chez SHEMA MARKET",ls:"Connectez-vous",add:"Ajouter au Panier",ord:"Commander sur WhatsApp"},sw:{sub:"Fresh - Haraka - Bei Nafuu",w:"wanaangalia",wel:"Karibu SHEMA MARKET",ls:"Ingia au Jisajili",add:"Weka Kwenye Kikapu",ord:"Agiza kwa WhatsApp"}};
function setL(l){lang=l;document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l==l));document.querySelectorAll('[data-t]').forEach(e=>{e.innerText=T[l][e.dataset.t]});fil()}
function oL(){document.getElementById('m').classList.add('open')}function cL(){document.getElementById('m').classList.remove('open')}
function au(){let n=document.getElementById('nm').value||'User',e=document.getElementById('em').value;if(!e)return alert('Enter Email');localStorage.setItem('su',n);cL();alert('Welcome '+n)}
const P=[["Avocado 5pcs",3000,"photo-1523049673857-eb18f1d7b578"],["Rice 5kg",7500,"photo-1586201375761-83865001e31c"],["Sneakers White",35000,"photo-1542291026-7eec264c27ff"],["Phone Charger",12000,"photo-1583863788434-e58a36330cf0"]];
function fil(){let q=document.getElementById('q').value.toLowerCase();document.getElementById('g').innerHTML=P.filter(p=>p[0].toLowerCase().includes(q)).map((p,i)=>`<div class="card"><img src="https://images.unsplash.com/${p[2]}?w=400"><div class="in"><b>${p[0]}</b><div class="pr">${p[1]} RWF</div><button class="btn2" onclick="add(${i})">${T[lang].add}</button><a class="btn" style="display:block;text-decoration:none" href="https://wa.me/250734311682?text=Hello SHEMA, I want ${p[0]}">${T[lang].ord}</a></div></div>`).join('')}
function add(i){if(!localStorage.getItem('su')){oL();return alert('Please Login first')}cart.push(P[i]);document.getElementById('c').innerText=cart.length;document.getElementById('t').innerText=cart.reduce((s,p)=>s+p[1],0)+' RWF'}
function co(){if(!cart.length)return alert('Cart empty');location.href='https://wa.me/250734311682?text='+encodeURIComponent('Hello SHEMA, Order: '+cart.map(p=>p[0]).join(', '))}
fil();setL('en');
</script></body></html>
