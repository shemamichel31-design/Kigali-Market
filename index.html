<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f0f2f5;color:#111;padding-bottom:95px}
header{background:#1e6bff;color:white;padding:16px 15px;position:sticky;top:0;z-index:10}
.top{display:flex;justify-content:space-between;align-items:center}
.top h1{font-size:22px}
.top button{background:white;color:#1e6bff;border:none;padding:8px 14px;border-radius:20px;font-weight:bold;cursor:pointer}
.livebar{background:#ff0000;color:white;padding:8px 15px;display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:bold}

.cats button.active{background:#1e6bff;color:white}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 15px}
.card{background:white;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.08);position:relative}
.card img,.card video{width:100%;height:140px;object-fit:cover;background:#eee;display:block}
.card .in{padding:10px}
.price{color:#1e6bff;font-weight:bold;margin:4px 0}
.btn{display:block;background:#25D366;color:white;text-align:center;padding:10px;border-radius:8px;text-decoration:none;font-weight:bold;margin-top:6px;font-size:14px;border:none;width:100%;cursor:pointer}
.btn2{background:#1e6bff}.btn3{background:#ff6b00}.btnRed{background:#ff0000}
.fav{position:absolute;top:8px;right:8px;background:white;border:none;width:32px;height:32px;border-radius:50%;font-size:16px;cursor:pointer;z-index:2}
.bottom{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;border-top:1px solid #eee;padding:8px;z-index:20}
.bottom button{flex:1;border:none;background:none;font-size:12px;cursor:pointer;padding:6px}
.bottom button b{display:block;font-size:20px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30;align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.sheet{background:white;width:100%;max-width:500px;border-radius:20px 20px 0 0;padding:20px;max-height:88vh;overflow:auto}
.sheet input,.sheet select,.sheet textarea{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:10px;font-size:15px}
.close{float:right;border:none;background:#eee;width:30px;height:30px;border-radius:50%;cursor:pointer}
.cartItem{display:flex;gap:10px;background:#f8f8f8;padding:10px;border-radius:10px;margin:6px 0;align-items:center}
.cartItem img{width:60px;height:60px;object-fit:cover;border-radius:8px}
.momo{background:#fff3cd;border:1px solid #ffd60a;padding:12px;border-radius:10px;margin:10px 0;text-align:center}
.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:#111;color:white;padding:10px 18px;border-radius:20px;z-index:50;display:none}
.info{background:#e8f0ff;padding:12px 15px;margin:10px 15px;border-radius:10px;font-size:13px}
.googleBtn{background:white!important;color:#111!important;border:1px solid #ddd!important}
.divider{text-align:center;color:#888;margin:10px 0;font-size:13px}
#liveVideo{width:100%;border-radius:12px;background:#000;max-height:300px}
.preview{width:100%;max-height:180px;object-fit:cover;border-radius:10px;display:none;margin-top:6px}
</style>
</head>
