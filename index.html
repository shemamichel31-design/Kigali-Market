<!DOCTYPE html>
<html lang="rw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHEMA MARKET - Kigali</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f5f5f5;color:#111}
header{background:#ff6b00;color:white;padding:20px;text-align:center}
header h1{font-size:28px}
header p{margin-top:5px}
.search{padding:15px}
.search input{width:100%;padding:14px;border-radius:10px;border:1px solid #ddd;font-size:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 15px 20px}
.card{background:white;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.card img{width:100%;height:140px;object-fit:cover}
.card div{padding:10px}
.card h3{font-size:15px}
.price{color:#ff6b00;font-weight:bold;margin:5px 0}
.btn{display:block;background:#25D366;color:white;text-align:center;padding:10px;border-radius:8px;text-decoration:none;font-weight:bold;margin-top:5px}
footer{text-align:center;padding:20px;color:#888}
</style>
</head>
<body>
<header>
<h1>🛒 SHEMA MARKET</h1>
<p>Gura Live Hano - Kigali</p>
<p>📞 0788 123 456 | Delivery Yihuta</p>
</header>
<div class="search"><input placeholder="🔍 Shaka ibicuruzwa..."></div>
<div class="grid">
<div class="card"><img src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=400"><div><h3>Imboga Fresh</h3><div class="price">2,000 RWF</div><a class="btn" href="https://wa.me/250788123456">Gura kuri WhatsApp</a></div></div>
<div class="card"><img src="https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6?w=400"><div><h3>Apple Fresh</h3><div class="price">1,500 RWF</div><a class="btn" href="https://wa.me/250788123456">Gura kuri WhatsApp</a></div></div>

<div class="card"><img src="https://images.unsplash.com/photo-1588964895597-cfccd6e2dbf9?w=400"><div><h3>Umugati</h3><div class="price">1,000 RWF</div><a class="btn" href="https://wa.me/250788123456">Gura kuri WhatsApp</a></div></div>
</div>
<footer>© 2026 SHEMA MARKET - Kigali</footer>

</html>
