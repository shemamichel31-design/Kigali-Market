<!DOCTYPE html>
<html lang="rw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kigali-Market</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:Arial;padding:12px}
.card{max-width:460px;margin:20px auto;background:#151515;border-radius:24px;overflow:hidden;border:1px solid #222}
.img-wrap{background:#fff;padding:15px;display:flex;justify-content:center;height:520px}
.img-wrap img{max-width:100%;max-height:100%;object-fit:contain}
.box{padding:22px}
.price{color:#00ff88;font-size:38px;font-weight:900}
.old{color:#555;text-decoration:line-through;margin-left:8px;font-size:16px}
.btn{width:100%;padding:16px;border-radius:14px;font-weight:900;border:none;margin-top:10px}
.buy{background:#00ff88;color:#000}
.edit{background:transparent;color:#666;border:1px dashed #333;font-size:12px}
.specs{background:#1e1e1e;border-radius:14px;padding:12px;margin:14px 0;font-size:13px;color:#aaa;line-height:1.6}
</style>
</head>
<body>
<div class="card">
<div class="img-wrap">
<img src="hoverboard.jpg" alt="Hoverboard">
</div>
<div class="box">
<h1>🔥 Hoverboard 6.5" Blue Flame</h1>
<p style="color:#888;font-size:13px;margin:8px 0">Blue Fire + Spider Grip + LED</p>
<div><span class="price" id="price">RWF 450,000</span><span class="old">RWF 600,000</span></div>
<div class="specs">✅ 10KM Range • 100KG Max • Self-Balancing<br>✅ Bluetooth Speaker • 6 Months Warranty<br>📍 FREE Delivery Kigali</div>
<button class="btn buy" onclick="window.open('https://wa.me/250788000000?text=Ndifuza Hoverboard Blue Flame '+document.getElementById('price').innerText,'_blank')">🛒 BUY NOW - WhatsApp</button>
<button class="btn edit" onclick="let p=prompt('Igiciro gishya:'); if(p)document.getElementById('price').innerText=p">✏️ Hindura Igiciro (Manual Price)</button>
</div>
</div>
</body>
</html>
