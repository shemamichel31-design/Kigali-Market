<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHEMA MARKET - Kigali</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f0f2f5;color:#111;padding-bottom:100px}
header{background:#1e6bff;color:white;padding:16px 15px;position:relative;z-index:5}
.top{display:flex;justify-content:space-between;align-items:center}
.top h1{font-size:22px}
.top button{background:white;color:#1e6bff;border:none;padding:8px 14px;border-radius:20px;font-weight:bold;cursor:pointer}
.livebar{background:#ff0000;color:white;padding:8px 15px;display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:bold}
.livebar button{background:white;color:#ff0000;border:none;padding:5px 12px;border-radius:20px;font-weight:bold;cursor:pointer}
.search{padding:12px 15px;background:white}
.search input{width:100%;padding:13px;border-radius:10px;border:1px solid #ddd;font-size:15px}
.cats{display:flex;gap:8px;overflow-x:auto;padding:10px 15px}
.cats button{white-space:nowrap;border:1px solid #ddd;background:white;padding:8px 14px;border-radius:20px;cursor:pointer}
.cats button.active{background:#1e6bff;color:white}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 15px;position:relative;z-index:1}
.card{background:white;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.card img{width:100%;height:140px;object-fit:cover;background:#eee;display:block}
.card .in{padding:10px}
.price{color:#1e6bff;font-weight:bold;margin:4px 0}
